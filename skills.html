<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills</title>
    <link rel="icon" href="imgs/skills.png" />
    <link rel="stylesheet" href="skills.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h2>🛠️ Skills</h2>
        <ul class="items">
          <li class="item">
            <img src="imgs/html.png" alt="html-logo" />
            <span class="name">HTML</span>
            <div class="dots">
              <span class="dot on"></span>
              <span class="dot on"></span>
              <span class="dot on"></span>
              <span class="dot"></span>
            </div>
          </li>

          <li class="item">
            <img src="imgs/csspng.png" alt="css-logo" />
            <span class="name">CSS</span>
            <div class="dots">
              <span class="dot on"></span>
              <span class="dot on"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </li>

          <li class="item">
            <img src="imgs/js.png" alt="js-logo" />
            <span class="name">JavaScript</span>
            <div class="dots">
              <span class="dot on"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </li>

          <li class="item">
            <img src="imgs/tailwindcss.png" alt="tailwindcss-logo" />
            <span class="name">Tailwind CSS</span>
            <div class="dots">
              <span class="dot on"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </li>

          <li class="item">
            <img src="imgs/git.png" alt="git-logo" />
            <span class="name">Git</span>
            <div class="dots">
              <span class="dot on"></span>
              <span class="dot on"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </li>

          <li class="item">
            <img src="imgs/githubskill.png" alt="github-logo" />
            <span class="name">Github</span>
            <div class="dots">
              <span class="dot on"></span>
              <span class="dot on"></span>
              <span class="dot on"></span>
              <span class="dot"></span>
            </div>
          </li>
        </ul>
      </section>

      <section class="card">
        <h2>🧰 Tools</h2>
        <ul class="items">
          <li class="item">
            <img src="imgs/vscode.png" alt="VS Code" />
            <span class="name">VS Code</span>
            <div class="dots">
              <span class="dot on"></span>
              <span class="dot on"></span>
              <span class="dot on"></span>
              <span class="dot on"></span>
            </div>
          </li>

          <li class="item">
            <img src="imgs/figma.png" alt="figma" />
            <span class="name">VS Code</span>
            <div class="dots">
              <span class="dot on"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </li>

          <li class="item">
            <img src="imgs/gitbash.png" alt="gitbash" />
            <span class="name">VS Code</span>
            <div class="dots">
              <span class="dot on"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
